# Transparência do fundo. 1.0 = opaco, 0.0 = totalmente transparente.

include ~/.cache/wal/colors-kitty.conf
background_opacity 0.60

# Padding
window_padding_width 10

# Permite que outros programas possam modificar o kityy depois de aberto.
allow_remote_control yes

# Fontes
font_family	Rec Mono Linear Nerd Font

cursor_trail 100
tab_bar_style powerline
tab_powerline_style round

# Cor dos diretorios
#color4 #077a91
#color12 #83a598

# cores primarias
#background #211421
#foreground #f3afe5


# BEGIN_KITTY_THEME
# Catppuccin-Latte
#include themes/Catppuccin-Latte.conf
# END_KITTY_THEME